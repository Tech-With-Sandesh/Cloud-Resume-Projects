---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: microservices
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-service
  namespace: microservices
spec:
  selector:
    app: backend-api
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP

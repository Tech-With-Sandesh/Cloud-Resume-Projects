apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  namespace: default
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /
spec:
  selector:
    app: web-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: LoadBalancer

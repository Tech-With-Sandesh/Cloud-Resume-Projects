trigger:
  branches:
    include:
      - main

variables:
  dockerRegistryServiceConnection: 'acr-service-connection'
  imageRepository: 'webapp'
  containerRegistry: 'yourprojectacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'
  aksResourceGroup: 'aks-rg'
  aksClusterName: 'cloud-aks-aks'
  k8sNamespace: 'production'

stages:
  # ──────────────────────────────────────────
  # Stage 1: Build & Test
  # ──────────────────────────────────────────
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Build Docker Image and Run Tests'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'

          - script: |
              pip install -r requirements.txt
              python -m pytest tests/ -v --junitxml=test-results.xml
            displayName: 'Install dependencies and run tests'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results.xml'
            displayName: 'Publish test results'
            condition: always()

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

  # ──────────────────────────────────────────
  # Stage 2: Push to ACR
  # ──────────────────────────────────────────
  - stage: Push
    displayName: 'Push to ACR'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PushJob
        displayName: 'Push Docker Image to ACR'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: 'Push to ACR'
            inputs:
              command: push
              repository: $(imageRepository)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

  # ──────────────────────────────────────────
  # Stage 3: Deploy to AKS
  # ──────────────────────────────────────────
  - stage: Deploy
    displayName: 'Deploy to AKS'
    dependsOn: Push
    condition: succeeded()
    jobs:
      - deployment: DeployToAKS
        displayName: 'Deploy to AKS Production'
        pool:
          vmImage: $(vmImageName)
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  displayName: 'Deploy to AKS'
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: 'azure-service-connection'
                    azureResourceGroup: $(aksResourceGroup)
                    kubernetesCluster: $(aksClusterName)
                    namespace: $(k8sNamespace)
                    manifests: |
                      kubernetes/deployment.yaml
                      kubernetes/service.yaml
                    containers: |
                      $(containerRegistry)/$(imageRepository):$(tag)
